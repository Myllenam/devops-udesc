
name: CI - API Gateway

on:
  push:
    branches: [develop, main]
    paths:
      - 'api-gateway/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-gateway.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'api-gateway/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-gateway.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validar API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build \
            -t api-gateway:test \
            ./api-gateway

      - name: Validar configuração do Nginx
        run: |
          docker run --rm \
            -e PORT=80 \
            -e AUTH_URL=http://auth:8080 \
            -e USUARIOS_URL=http://usuarios:8080 \
            -e LIVROS_URL=http://livros:8080 \
            -e EMPRESTIMOS_URL=http://emprestimos:8080 \
            --add-host auth:127.0.0.1 \
            --add-host usuarios:127.0.0.1 \
            --add-host livros:127.0.0.1 \
            --add-host emprestimos:127.0.0.1 \
            api-gateway:test nginx -t

  publish-docker:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    needs: build-and-test

    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem do API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/myllenam/devops-udesc-api-gateway:${{ github.ref_name }}
            ghcr.io/myllenam/devops-udesc-api-gateway:sha-${{ github.sha }}

      - name: Deploy automático no Render DEV
        if: github.ref == 'refs/heads/develop'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY_DEV }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST "$DEPLOY_HOOK"
