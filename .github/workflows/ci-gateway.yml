
name: CI - API Gateway

on:
  push:
    branches: [develop, main]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-gateway.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-gateway.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validar API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build \
            -t api-gateway:test \
            ./api-gateway

      - name: Validar configuração do Nginx
        run: |
          docker run --rm \
            --add-host usuarios:127.0.0.1 \
            --add-host auth:127.0.0.1 \
            --add-host livros:127.0.0.1 \
            --add-host emprestimos:127.0.0.1 \
            api-gateway:test nginx -t

  publish-docker:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem do API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/myllenam/devops-udesc-api-gateway:${{ github.ref_name }}
            ghcr.io/myllenam/devops-udesc-api-gateway:sha-${{ github.sha }}
