
name: CI - Usuarios

on:
  push:
    branches: [develop, main]
    paths:
      - 'usuarios/**'
      - '.github/workflows/ci-usuarios.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'usuarios/**'
      - '.github/workflows/ci-usuarios.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./usuarios

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Build e testes com cobertura
        run: mvn -B clean verify

      - name: Verificar relatório JaCoCo
        run: |
          test -f target/site/jacoco/jacoco.xml
          echo "Relatório JaCoCo encontrado!"

      - name: Análise SonarQube Cloud
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_USUARIOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=myllenam_devops-udesc-usuarios
          -Dsonar.organization=myllenam
          -Dsonar.host.url=https://sonarcloud.io
