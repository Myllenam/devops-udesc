
name: CI - Emprestimos

on:
  push:
    branches: [develop, main]
    paths:
      - 'emprestimos/**'
      - '.github/workflows/ci-emprestimos.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'emprestimos/**'
      - '.github/workflows/ci-emprestimos.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./emprestimos

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: emprestimos/pom.xml

      - name: Build e testes com cobertura
        run: mvn -B clean verify

      - name: Verificar relatório JaCoCo
        run: |
          test -f target/site/jacoco/jacoco.xml
          echo "Relatório JaCoCo encontrado!"

      - name: Análise SonarQube Cloud
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_EMPRESTIMOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=myllenam_devops-udesc-emprestimos
          -Dsonar.organization=myllenam
          -Dsonar.host.url=https://sonarcloud.io
  publish-docker:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem de Empréstimos
        uses: docker/build-push-action@v6
        with:
          context: ./emprestimos
          file: ./emprestimos/Dockerfile
          push: true
          tags: |
            ghcr.io/myllenam/devops-udesc-emprestimos:${{ github.ref_name }}
            ghcr.io/myllenam/devops-udesc-emprestimos:sha-${{ github.sha }}

      - name: Deploy automático no Render DEV
            if: github.ref == 'refs/heads/develop'
            env:
              DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_EMPRESTIMOS_DEV }}
            run: |
              curl --fail-with-body --show-error --silent \
                --request POST "$DEPLOY_HOOK"
