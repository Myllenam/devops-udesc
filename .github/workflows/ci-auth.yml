
name: CI - Auth

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*.*.*'
    paths:
      - 'auth/**'
      - '.github/workflows/ci-auth.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'auth/**'
      - '.github/workflows/ci-auth.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./auth

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: auth/pom.xml

      - name: Build e testes com cobertura
        run: mvn -B clean verify

      - name: Análise SonarQube Cloud
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=myllenam_devops-udesc-auth
          -Dsonar.organization=myllenam
          -Dsonar.host.url=https://sonarcloud.io

  publish-docker:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/myllenam/devops-udesc-auth
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-

      - name: Publicar imagem de Auth
        uses: docker/build-push-action@v6
        with:
          context: ./auth
          file: ./auth/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy automático no Render DEV
        if: github.ref == 'refs/heads/develop'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AUTH_DEV }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST "$DEPLOY_HOOK"

      - name: Deploy automático no Render HOMOL
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AUTH_HOMOL }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST "$DEPLOY_HOOK"
