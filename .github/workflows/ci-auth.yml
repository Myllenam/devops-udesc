
name: CI - Auth

on:
  push:
    branches: [develop, main]
    paths:
      - 'auth/**'
      - '.github/workflows/ci-auth.yml'

  pull_request:
    branches: [develop, main]
    paths:
      - 'auth/**'
      - '.github/workflows/ci-auth.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./auth

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: auth/pom.xml

      - name: Build e testes com cobertura
        run: mvn -B clean verify

      - name: Análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=myllenam_devops-udesc-auth
          -Dsonar.organization=myllenam
