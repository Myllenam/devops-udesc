
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 20s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: "biblioteca-k8s"
        metrics_path: /actuator/prometheus
        scheme: http

        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/metrics_token

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: "auth|usuarios|livros|emprestimos"

          - source_labels:
              - __meta_kubernetes_pod_ip
            target_label: __address__
            replacement: "$1:8080"

          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
