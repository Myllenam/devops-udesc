
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emprestimos
  labels:
    app: emprestimos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emprestimos
  template:
    metadata:
      labels:
        app: emprestimos
    spec:
      containers:
        - name: emprestimos
          image: ghcr.io/myllenam/devops-udesc-emprestimos:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: emprestimos-config
            - secretRef:
                name: emprestimos-secret

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
