
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-usuarios
  labels:
    app: postgres-usuarios
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-usuarios
  template:
    metadata:
      labels:
        app: postgres-usuarios
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432

          envFrom:
            - configMapRef:
                name: postgres-usuarios-config
            - secretRef:
                name: postgres-usuarios-secret

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-usuarios-pvc
