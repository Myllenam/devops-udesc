
# Perfil Kubernetes - Usuarios

server.port=${SERVER_PORT:8080}

# Conexoes e credenciais sao recebidas por variaveis
# de ambiente definidas no ConfigMap e no Secret.

# Observabilidade
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Documentacao da API
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
