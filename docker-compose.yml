
services:

  # ==========================
  # RABBITMQ
  # ==========================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================
  # BANCO DE DADOS - LIVROS
  # ==========================
  postgres-livros:
    image: postgres:16-alpine
    container_name: livros-db

    environment:
      POSTGRES_DB: livros_db
      POSTGRES_USER: livros_user
      POSTGRES_PASSWORD: ${LIVROS_DB_PASSWORD:?Defina LIVROS_DB_PASSWORD}

    ports:
      - "5439:5432"

    volumes:
      - livros_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livros_user -d livros_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================
  # MICROSSERVIÇO - LIVROS
  # ==========================
  livros:
    build:
      context: ./livros
      dockerfile: Dockerfile

    container_name: livros

    depends_on:
      postgres-livros:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-livros:5432/livros_db
      SPRING_DATASOURCE_USERNAME: livros_user
      SPRING_DATASOURCE_PASSWORD: ${LIVROS_DB_PASSWORD:?Defina LIVROS_DB_PASSWORD}

      AUTH_SERVICE_URL: http://auth:8080

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    expose:
      - "8080"

    networks:
      - biblioteca-net


  # ==========================
  # BANCO DE DADOS - EMPRÉSTIMOS
  # ==========================
  postgres-emprestimos:
    image: postgres:16-alpine
    container_name: emprestimos-db

    environment:
      POSTGRES_DB: emprestimos_db
      POSTGRES_USER: emprestimos_user
      POSTGRES_PASSWORD: ${EMPRESTIMOS_DB_PASSWORD:?Defina EMPRESTIMOS_DB_PASSWORD}

    ports:
      - "5440:5432"

    volumes:
      - emprestimos_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emprestimos_user -d emprestimos_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================
  # MICROSSERVIÇO - EMPRÉSTIMOS
  # ==========================
  emprestimos:
    build:
      context: ./emprestimos
      dockerfile: Dockerfile

    container_name: emprestimos

    depends_on:
      postgres-emprestimos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-emprestimos:5432/emprestimos_db
      SPRING_DATASOURCE_USERNAME: emprestimos_user
      SPRING_DATASOURCE_PASSWORD: ${EMPRESTIMOS_DB_PASSWORD:?Defina EMPRESTIMOS_DB_PASSWORD}

      AUTH_SERVICE_URL: http://auth:8080

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    expose:
      - "8080"

    networks:
      - biblioteca-net


  # ==========================
  # BANCO DE DADOS - USUÁRIOS
  # ==========================
  postgres-usuarios:
    image: postgres:16-alpine
    container_name: usuarios-db

    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: usuarios_user
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD:?Defina USUARIOS_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - usuarios_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios_user -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================
  # MICROSSERVIÇO - USUÁRIOS
  # ==========================
  usuarios:
    build:
      context: ./usuarios
      dockerfile: Dockerfile

    container_name: usuarios

    depends_on:
      postgres-usuarios:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: usuarios_user
      SPRING_DATASOURCE_PASSWORD: ${USUARIOS_DB_PASSWORD:?Defina USUARIOS_DB_PASSWORD}

      AUTH_SERVICE_URL: http://auth:8080

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    expose:
      - "8080"

    networks:
      - biblioteca-net


  # ==========================
  # BANCO DE DADOS - AUTH
  # ==========================
  postgres-auth:
    image: postgres:16-alpine
    container_name: auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Defina AUTH_DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - auth_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ==========================
  # MICROSSERVIÇO - AUTH
  # ==========================
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile

    container_name: auth

    depends_on:
      postgres-auth:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?Defina AUTH_DB_PASSWORD}

      USUARIOS_SERVICE_URL: http://usuarios:8080

      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

    expose:
      - "8080"

    networks:
      - biblioteca-net


  # ==========================
  # API GATEWAY - NGINX
  # ==========================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "80:80"

    depends_on:
      - usuarios
      - auth
      - livros
      - emprestimos

    networks:
      - biblioteca-net


# ==========================
# REDE
# ==========================
networks:
  biblioteca-net:
    driver: bridge


# ==========================
# VOLUMES
# ==========================
volumes:
  usuarios_data:
  auth_data:
  livros_data:
  emprestimos_data:
