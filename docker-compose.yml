services:

  postgres-usuarios:
    image: postgres:16-alpine
    container_name: usuarios-db

    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: usuarios_user
      POSTGRES_PASSWORD: usuarios_pass

    ports:
      - "5433:5432"

    volumes:
      - usuarios_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios_user -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  usuarios:
    build:
      context: ./usuarios
      dockerfile: Dockerfile

    container_name: usuarios

    depends_on:
      postgres-usuarios:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: usuarios_user
      SPRING_DATASOURCE_PASSWORD: usuarios_pass
      AUTH_SERVICE_URL: http://auth:8080

    ports:
      - "8082:8080"

    networks:
      - biblioteca-net


  postgres-auth:
    image: postgres:16-alpine
    container_name: auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass

    ports:
      - "5434:5432"

    volumes:
      - auth_data:/var/lib/postgresql/data

    networks:
      - biblioteca-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile

    container_name: auth

    depends_on:
      postgres-auth:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      USUARIOS_SERVICE_URL: http://usuarios:8080
      JWT_SECRET: troque-este-segredo-por-uma-chave-forte-de-no-minimo-256-bits-em-producao
      JWT_EXPIRATION_MS: 3600000

    ports:
      - "8083:8080"

    networks:
      - biblioteca-net


  api-gateway:
    image: nginx:latest
    container_name: api-gateway-2

    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "80:80"

    depends_on:
      - usuarios
      - auth

    networks:
      - biblioteca-net


networks:
  biblioteca-net:
    driver: bridge


volumes:
  usuarios_data:
  auth_data: