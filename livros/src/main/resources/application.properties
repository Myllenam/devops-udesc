spring.application.name=Livros
spring.datasource.url=jdbc:postgresql://localhost:5439/livros_db
spring.datasource.username=livros_user
spring.datasource.password=livros_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

auth.service.url=http://localhost:8082

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest